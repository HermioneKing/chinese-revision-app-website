

# Frontend uses the image from Dockerfile.frontend (next build + next start). No bind mount:
# bind-mount + `next dev`/Turbopack in Docker often breaks over public IPs (stale / Turbopack errors).
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Leave unset for HTTPS same-host deploy (browser → /api → nginx → backend).
        # Set in .env e.g. http://127.0.0.1:5007/api only when the browser must call the API by host port.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    ports:
      - "3007:3000"
    environment:
      - NODE_ENV=production
      # Override root .env PORT (backend); Next must listen on container port 3000 (see ports 3007:3000).
      - PORT=3000
      # Browser: omit or leave empty → same-origin /api/... (correct behind nginx + HTTPS).
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-}
      # RSC/server fetches from inside Docker network:
      - SERVER_API_BASE_URL=http://backend:5007/api
      # Browser can use origin /api/... rewrite when NEXT_PUBLIC_API_BASE_URL is empty:
      - NEXT_BACKEND_ORIGIN=http://backend:5007
    env_file: .env
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5007:5007"
    volumes:
      - /app/backend/node_modules # Exclude backend node_modules from host mount
    environment:
      - NODE_ENV=development
      - PORT=5007
      - JWT_SECRET=${JWT_SECRET}
      # Postgres from /root/database/docker-compose.yml — service `postgres`, port 5432 inside Docker.
      # Shared network name is fixed (`dse_revision_db`) so this repo works on any machine after DB stack is up.
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/dse12app_demo
    env_file: backend/.env
    networks:
      - default
      - dse_revision_db

networks:
  dse_revision_db:
    external: true
    name: dse_revision_db
