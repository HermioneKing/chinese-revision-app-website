

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3003:3000"
    volumes:
      - .:/app
      - /app/node_modules # Exclude node_modules from host mount
    environment:
      - NODE_ENV=development
      # NEXT_PUBLIC_* is embedded for the browser — must reach the host-mapped backend, not hostname "backend".
      - NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:5003/api
      # RSC/server fetches from inside Docker network:
      - SERVER_API_BASE_URL=http://backend:5003/api
      # Browser can use origin /api/... rewrite when NEXT_PUBLIC_API_BASE_URL is empty:
      - NEXT_BACKEND_ORIGIN=http://backend:5003
    env_file: .env
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5003:5003"
    # REMOVE THIS: - .:/app # Remove volume mount to prevent overwriting built files
    volumes:
      - /app/backend/node_modules # Exclude backend node_modules from host mount
    environment:
      - NODE_ENV=development
      - JWT_SECRET=${JWT_SECRET}
      # Container cannot use 127.0.0.1 for host Postgres; route via host gateway.
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5433/dse12app_demo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: backend/.env

  db:
    image: postgres:16-alpine # Use a recent stable PostgreSQL image
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data # Persistent data volume

volumes:
  db_data: # Define the named volume for database persistence
