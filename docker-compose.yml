

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Same host your browser uses; 127.0.0.1 only works when the browser runs on the Docker host.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:5003/api}
    ports:
      - "3003:3000"
    volumes:
      - .:/app
      - /app/node_modules # Exclude node_modules from host mount
    environment:
      - NODE_ENV=development
      # Override root .env PORT=5003 (backend); Next must listen on container port 3000 (see ports 3003:3000).
      - PORT=3000
      # Browser calls this URL from the client machine (not from inside Docker).
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:5003/api}
      # RSC/server fetches from inside Docker network:
      - SERVER_API_BASE_URL=http://backend:5003/api
      # Browser can use origin /api/... rewrite when NEXT_PUBLIC_API_BASE_URL is empty:
      - NEXT_BACKEND_ORIGIN=http://backend:5003
    env_file: .env
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5003:5003"
    volumes:
      - /app/backend/node_modules # Exclude backend node_modules from host mount
    environment:
      - NODE_ENV=development
      - JWT_SECRET=${JWT_SECRET}
      # Postgres from /root/database/docker-compose.yml — service `postgres`, port 5432 inside Docker.
      # Shared network name is fixed (`dse_revision_db`) so this repo works on any machine after DB stack is up.
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/dse12app_demo
    env_file: backend/.env
    networks:
      - default
      - dse_revision_db

networks:
  dse_revision_db:
    external: true
    name: dse_revision_db
